  <rect width="1200" height="250" rx="24" fill="url(#grid)"/>
  <path d="M0 205 C230 165 360 255 570 205 S900 150 1200 195" fill="none" stroke="#5EEAD4" stroke-opacity="0.10" stroke-width="1.5"/>
  <g fill="none" stroke="url(#line)" stroke-width="1.8">
    <path d="M810 75L900 45L1000 88L1100 50"/>
    <path d="M810 75L875 155L985 145L1100 50"/>
    <path d="M900 45L985 145L1085 190"/>
    <path d="M1000 88L1085 190"/>
    <path d="M875 155L950 215L1085 190"/>
