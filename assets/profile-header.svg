<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
  <title id="title">Rodion Orkin — Machine Learning Engineer</title>
  <desc id="desc">Minimal dark gradient banner with a subtle machine-learning network motif.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#142B3A"/>
      <stop offset="1" stop-color="#0B4C4A"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="40%" r="65%">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5EEAD4" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#60A5FA" stop-opacity="0.18"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#D1FAE5" stroke-opacity="0.045" stroke-width="1"/>
